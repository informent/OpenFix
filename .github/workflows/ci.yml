name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - run: dotnet run --project tests/OpenFixEngineTests.csproj --nologo
      - run: dotnet build OpenFix.csproj -c Release --nologo
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Test-Release.ps1
